spring.application.name=thesis

# Disable DevTools restart for stability
spring.devtools.restart.enabled=false

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# HikariCP Connection Pool Configuration for Supabase
# IMPORTANT: Use Transaction mode (port 6543) with simple query mode for JPA compatibility
# Transaction mode: jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:6543/postgres?sslmode=require&preferQueryMode=simple&prepareThreshold=0
# Session mode (has client limits): jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:5432/postgres?sslmode=require&prepareThreshold=0

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.leak-detection-threshold=60000

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=${PORT:8080}

# File Upload Configuration (supports 10 images per announcement)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB
server.tomcat.max-http-post-size=104857600

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

jwt.secret=${JWT_SECRET:defaultSecretKeyForJWTWhichIsAtLeast256BitsLong}
jwt.expiration=86400000

# Supabase Storage Configuration (optional)
supabase.url=${SUPABASE_URL:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}

# Public media URL configuration (optional, for CDN like Cloudflare)
# Example:
# media.origin-base-url=https://<project>.supabase.co/storage/v1/object/public
# media.public-base-url=https://media.example.com
media.origin-base-url=${MEDIA_ORIGIN_BASE_URL:}
media.public-base-url=${MEDIA_PUBLIC_BASE_URL:}
media.use-signed-urls=${MEDIA_USE_SIGNED_URLS:false}
media.signed-url-ttl-seconds=${MEDIA_SIGNED_URL_TTL_SECONDS:600}

# Encryption Configuration
encryption.key=${ENCRYPTION_KEY:defaultEncryptionKeyChangeInProduction}

# Image Processing Configuration
image.quality=0.85

# Scheduled Jobs Configuration
spring.task.scheduling.pool.size=2
spring.task.scheduling.thread-name-prefix=scheduler-

# Authentication domain policy (recommended enabled in production)
auth.enforce-domain=${AUTH_ENFORCE_DOMAIN:true}
auth.allowed-domain=${AUTH_ALLOWED_DOMAIN:iacademy.edu.ph}

# Frontend URL used in share-page redirects and email call-to-actions
frontend.url=${FRONTEND_URL:http://localhost:3000}
